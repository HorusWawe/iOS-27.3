name: Android build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip python3-pil
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Generate boot animation and app icons
        run: |
          python3 tools/generate_bootanimation.py

      - name: Build debug APK
        run: /tmp/gradle-8.9/bin/gradle --no-daemon assembleDebug

      - name: Package Magisk module
        run: |
          mkdir -p out/ios27-magisk/system/product/media
          cp magisk/module.prop out/ios27-magisk/module.prop
          cp magisk/customize.sh out/ios27-magisk/customize.sh
          chmod 755 out/ios27-magisk/customize.sh
          cp build/bootanimation.zip out/ios27-magisk/system/product/media/bootanimation.zip
          cd out/ios27-magisk
          zip -r ../iOS27-Magisk.zip .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iOS27-0.1.0
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            out/iOS27-Magisk.zip
          if-no-files-found: error
