name: iOS 27.3 ARM64 build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios27-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-boot:
    name: Build ARM64 EFI image and boot in QEMU
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain and emulator
        timeout-minutes: 4
        run: |
          set -euo pipefail

          echo "Refreshing apt indexes (hard limit: 75 seconds)..."
          if ! timeout --signal=TERM --kill-after=5s 75s sudo apt-get update \\
            -o Acquire::http::Timeout=15 \\
            -o Acquire::https::Timeout=15 \\
            -o Acquire::Retries=0; then
            echo "::warning::apt-get update failed or timed out; trying the runner's existing package indexes."
          fi

          echo "Installing build and QEMU dependencies (hard limit: 150 seconds)..."
          timeout --signal=TERM --kill-after=5s 150s sudo apt-get install -y --no-install-recommends \\
            clang \\
            lld \\
            qemu-system-arm \\
            qemu-efi-aarch64 \\
            ipxe-qemu \\
            mtools \\
            dosfstools

      - name: Build ARM64 EFI image
        timeout-minutes: 2
        run: bash tools/build.sh

      - name: Boot image in QEMU
        timeout-minutes: 2
        run: bash tools/run-qemu.sh

      - name: Upload boot image
        uses: actions/upload-artifact@v4
        with:
          name: ios27.3-arm64-uefi
          path: |
            build/ios27.3-arm64.img
            build/BOOTAA64.EFI
          if-no-files-found: error
          retention-days: 14
